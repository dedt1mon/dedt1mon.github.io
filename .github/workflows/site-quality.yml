name: Site quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  site-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned development tools
        run: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --ignore-scripts
      - name: Static contracts and JavaScript syntax
        run: pnpm check
      - name: Prepare pinned Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real responsive, keyboard, accessibility and media acceptance
        run: pnpm test:browser
      - name: Preserve evidence for this exact head
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: test-results/
          retention-days: 30
          if-no-files-found: error
